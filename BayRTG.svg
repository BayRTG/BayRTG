<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="title desc">
  <title id="title">BayRTG profile and technology skills</title>
  <desc id="desc">Two rounded dark cards. The left card contains an avatar and cycling role text. The right card contains bouncing technology icons.</desc>

  <defs>
    <clipPath id="avatar-clip"><circle cx="112" cy="132" r="43"/></clipPath>
    <style><![CDATA[
      .card { fill: #101318; stroke: #343b46; stroke-width: 2; }
      .muted { fill: #a5adba; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .main { fill: #f5f7fa; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #9aa4b2; font: 700 12px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 3px; }
      .role { fill: #f5f7fa; font: 700 25px Inter, Segoe UI, Arial, sans-serif; opacity: 0; animation: roleCycle 6s linear infinite; }
      .role-two { animation-delay: -4s; }
      .role-three { animation-delay: -2s; }
      @keyframes roleCycle {
        0%, 27% { opacity: 1; transform: translateY(0); }
        32%, 95% { opacity: 0; transform: translateY(-7px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .bounce { transform-box: fill-box; transform-origin: center; animation: iconBounce 1.35s ease-in-out infinite; }
      .b2 { animation-delay: .12s; }
      .b3 { animation-delay: .24s; }
      .b4 { animation-delay: .36s; }
      .b5 { animation-delay: .48s; }
      .b6 { animation-delay: .60s; }
      .b7 { animation-delay: .72s; }
      .b8 { animation-delay: .84s; }
      .b9 { animation-delay: .96s; }
      .b10 { animation-delay: 1.08s; }
      .b11 { animation-delay: 1.20s; }
      .b12 { animation-delay: 1.32s; }
      @keyframes iconBounce {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(-9px); }
        65% { transform: translateY(1px); }
        80% { transform: translateY(-3px); }
      }
    ]]></style>
  </defs>

  <!-- Card backgrounds: independent rounded cards with a clear gutter -->
  <rect class="card" x="18" y="18" width="426" height="364" rx="24"/>
  <rect class="card" x="470" y="18" width="452" height="364" rx="24"/>

  <!-- PROFILE CARD -->
  <text class="eyebrow" x="52" y="62">PROFILE</text>

  <!-- Avatar fallback: replace YOUR_GITHUB_USERNAME below -->
  <circle cx="112" cy="132" r="44" fill="#222936" stroke="#596273" stroke-width="1.5"/>
  <text x="112" y="142" text-anchor="middle" fill="#f5f7fa" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">B</text>
  <image x="69" y="89" width="86" height="86"
         href="https://github.com/BayRTG.png"
         xlink:href="https://github.com/BayRTG.png"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>

  <text class="main" x="178" y="119" font-size="27" font-weight="700">BayRTG</text>
  <text class="muted" x="179" y="145" font-size="13">Fullstack Web Developer</text>

  <!-- Animated role text: each phrase takes a 2-second slot -->
  <g>
    <text class="role" x="52" y="229">Hi, I'm Bay</text>
    <text class="role role-two" x="52" y="229">Web Developer</text>
    <text class="role role-three" x="52" y="229">Fullstack Developer</text>
  </g>

  <line x1="52" y1="260" x2="408" y2="260" stroke="#303744" stroke-width="1"/>
  <text class="muted" x="52" y="293" font-size="14">Building useful applications with</text>
  <text class="muted" x="52" y="316" font-size="14">clean code and thoughtful design.</text>
  <text x="52" y="352" fill="#7f8998" font-size="11" font-family="Inter, Arial, sans-serif" letter-spacing="1.5">ALWAYS LEARNING · ALWAYS BUILDING</text>

  <!-- SKILLS CARD: icons only, staggered bounce -->
  <text class="eyebrow" x="506" y="62">TECH STACK</text>
  <text class="muted" x="506" y="86" font-size="12"> </text>

  <!-- Row 1 -->
  <g class="bounce b1"><image x="522" y="116" width="48" height="48" href="https://cdn.simpleicons.org/php/FFFFFF" xlink:href="https://cdn.simpleicons.org/php/FFFFFF"/></g>
  <g class="bounce b2"><image x="616" y="116" width="48" height="48" href="https://cdn.simpleicons.org/laravel/FFFFFF" xlink:href="https://cdn.simpleicons.org/laravel/FFFFFF"/></g>
  <g class="bounce b3"><image x="710" y="116" width="48" height="48" href="https://cdn.simpleicons.org/mysql/FFFFFF" xlink:href="https://cdn.simpleicons.org/mysql/FFFFFF"/></g>
  <g class="bounce b4"><image x="804" y="116" width="48" height="48" href="https://cdn.simpleicons.org/javascript/FFFFFF" xlink:href="https://cdn.simpleicons.org/javascript/FFFFFF"/></g>

  <!-- Row 2 -->
  <g class="bounce b5"><image x="522" y="210" width="48" height="48" href="https://cdn.simpleicons.org/html5/FFFFFF" xlink:href="https://cdn.simpleicons.org/html5/FFFFFF"/></g>
  <g class="bounce b6"><image x="616" y="210" width="48" height="48" href="https://cdn.simpleicons.org/css3/FFFFFF" xlink:href="https://cdn.simpleicons.org/css3/FFFFFF"/></g>
  <g class="bounce b7"><image x="710" y="210" width="48" height="48" href="https://cdn.simpleicons.org/tailwindcss/FFFFFF" xlink:href="https://cdn.simpleicons.org/tailwindcss/FFFFFF"/></g>
  <g class="bounce b8"><image x="804" y="210" width="48" height="48" href="https://cdn.simpleicons.org/bootstrap/FFFFFF" xlink:href="https://cdn.simpleicons.org/bootstrap/FFFFFF"/></g>

  <!-- Row 3 -->
  <g class="bounce b9"><image x="522" y="304" width="48" height="48" href="https://cdn.simpleicons.org/git/FFFFFF" xlink:href="https://cdn.simpleicons.org/git/FFFFFF"/></g>
  <g class="bounce b10"><image x="616" y="304" width="48" height="48" href="https://cdn.simpleicons.org/github/FFFFFF" xlink:href="https://cdn.simpleicons.org/github/FFFFFF"/></g>
  <g class="bounce b11"><image x="710" y="304" width="48" height="48" href="https://cdn.simpleicons.org/linux/FFFFFF" xlink:href="https://cdn.simpleicons.org/linux/FFFFFF"/></g>
  <g class="bounce b12"><image x="804" y="304" width="48" height="48" href="https://cdn.simpleicons.org/visualstudiocode/FFFFFF" xlink:href="https://cdn.simpleicons.org/visualstudiocode/FFFFFF"/></g>
</svg>
